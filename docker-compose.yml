services:
  frontend:
    profiles: ["ui"]
    image: node:24-alpine
    container_name: mqtt-chat-frontend
    working_dir: /app
    volumes:
      - ./services/frontend:/app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    env_file:
      - ./services/frontend/.env
    networks:
      - mqtt-chat-net

  mosquitto:
    image: eclipse-mosquitto:2.0.21
    container_name: mqtt-chat-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - mqtt-chat-net

networks:
  mqtt-chat-net:
    name: mqtt-chat-net

volumes:
  mosquitto_data:
  mosquitto_log:
