[project]
name = "mqtt-chat"
version = "0.1.0"
description = "Web platform: MQTT IoT devices, Firebase, FastAPI, FastMCP, Pydantic AI chat."
readme = "README.md"
authors = [
    { name = "andrequeiroz2", email = "andrequeiroz.com@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiomqtt>=2.5.1",
    "fastapi>=0.143.0",
    "firebase-admin>=7.7.0",
    "paho-mqtt>=2.1.0",
    "pydantic-ai>=2.55.0",
    "pydantic-settings>=2.15.0",
    "sse-starlette>=3.5.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mqtt-chat = "mqtt_chat:main"
mqtt-chat-api = "mqtt_chat.api.app:run"
mqtt-chat-worker = "mqtt_chat.worker.__main__:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
